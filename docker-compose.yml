# =============================================================================
# ScholarSync — full stack
#
#   cp .env.example .env     # fill in your Azure keys first
#   docker compose up --build
#
# Then:
#   http://localhost:8000        hub dashboard (+ /interview/api/* routes)
#   http://localhost:8000/docs   API reference for hub + interview
#   http://localhost:3001        interview UI
#   http://localhost:3000        expert-chat UI
#
# The hub and the MCP tool server share one image and differ only by command.
# =============================================================================

services:

  # ── Python services (one image, two commands) ──────────────────────────────

  mcp:
    build: .
    command: uvicorn chatbot.mcp_server.mcp_server:app --host 0.0.0.0 --port 8002
    env_file: .env
    environment:
      # Container hostnames, overriding the localhost defaults in .env. The
      # get_student_connections tool calls the chat API, and inside this
      # container "localhost" is this container -- not chat-api.
      CHAT_API_URL: http://chat-api:5000
      PUBLIC_BASE_URL: http://localhost:8000
      # MONGO_URI and DATABASE_URL intentionally NOT overridden: both are
      # managed instances (Atlas / Neon) reached the same way from .env
      # whether running locally or in Compose.
    volumes:
      # The Google service-account key is excluded from the build context by
      # .dockerignore so it is never baked into an image. Mount it read-only
      # instead; calendar_auth.py loads this path when
      # GOOGLE_SERVICE_ACCOUNT_JSON is unset. Calendar tools simply fail if
      # the file is absent, so the mount is safe to delete.
      - ./chatbot/mcp_server/service-account.json:/app/chatbot/mcp_server/service-account.json:ro
    ports:
      - "8002:8002"
    restart: unless-stopped

  hub:
    build: .
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      # Container hostnames, overriding the localhost defaults in .env.
      MCP_URL: http://mcp:8002
      # MONGO_URI and DATABASE_URL come from .env: both are managed instances
      # (Atlas / Neon), so no container-hostname override is needed here.
      CHAT_API_URL: http://chat-api:5000
      PUBLIC_BASE_URL: http://localhost:8000
      INTERVIEW_UI_URL: http://localhost:3001
    ports:
      - "8000:8000"
    depends_on:
      mcp:
        condition: service_started
    restart: unless-stopped

  # ── Expert chat (MERN) ─────────────────────────────────────────────────────

  chat-api:
    build: ./expert-chat
    environment:
      PORT: 5000
      # Mongoose reads the database name from the URI path, so this needs its
      # own value rather than MONGO_URI + DB_NAME. Set in .env (Atlas).
      MONGO_URI: ${CHAT_MONGO_URI:?CHAT_MONGO_URI must be set in .env}
      # Refuses to boot if unset. Generate with: openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CLIENT_URL: http://localhost:3000
      SERVER_URL: http://localhost:5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    # No depends_on: Mongo is remote (Atlas). Mongoose retries its initial
    # connection, so ordering against a local container is not needed.
    restart: unless-stopped

  chat-ui:
    build:
      context: ./expert-chat-ui
      args:
        # Baked in at build time by Create React App, so these are the URLs the
        # browser uses — host-visible, not container-internal.
        REACT_APP_API_URL: http://localhost:5000
        REACT_APP_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - chat-api
    restart: unless-stopped

  # ── Interview UI ───────────────────────────────────────────────────────────

  interview-ui:
    build:
      context: ./interview-ui
      args:
        # Must include both the /interview mount prefix and the /api segment:
        # the client calls e.g. `${REACT_APP_API_URL}/questions/topics`.
        REACT_APP_API_URL: http://localhost:8000/interview/api
    ports:
      - "3001:3000"
    depends_on:
      - hub
    restart: unless-stopped
